<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feriados nacionais</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="pagina">
    <h1>Feriados nacionais</h1>
    <p class="intro">Digite um ano e veja todos os feriados nacionais do Brasil.</p>

    <form id="formulario" class="formulario">
      <label for="ano">Ano</label>
      <input type="number" id="ano" inputmode="numeric" autocomplete="off">
      <button type="submit">Consultar</button>
    </form>

    <!-- Mensagens de erro ou aviso -->
    <p id="mensagem" class="mensagem" role="alert" hidden></p>

    <!-- Próximo feriado (desafio extra) -->
    <section id="proximo" class="proximo" hidden aria-live="polite">
      <h2>Próximo feriado</h2>
      <p class="proximo-nome" id="proximo-nome"></p>
      <p id="proximo-detalhe"></p>
    </section>

    <!-- Total e tabela -->
    <section id="resultado" hidden>
      <p id="total" class="total"></p>
      <p class="legenda"><span class="amostra"></span> Feriado em sábado ou domingo</p>

      <div class="rolagem">
        <table>
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Dia da semana</th>
              <th scope="col">Feriado</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
